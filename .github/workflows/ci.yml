name: CI
on:
  push:
    branches: [ master, main, feat/setup ]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y build-essential swig
      - name: Instalar o projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Conferir se a imagem Docker builda
        run: docker build -t finrl:ci .